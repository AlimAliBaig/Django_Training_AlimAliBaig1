<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products List</title>
</head>
<body>
    <div>
        <h1>Products List</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Product Price</th>
                <th>Product Offer</th>
            </tr>
            {% for i in Products %}
            <tr>
                <td>{{i.id}}</td>
                <td>{{i.p_name}}</td>
                <td>{{i.p_price}}</td>
                <td>{{i.p_offer}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
