<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Student Placement Prediction{% endblock %}</title>
<!-- Modern Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    /* CSS Variables & Theme Configuration */
    :root {
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        --nav-bg: rgba(255, 255, 255, 0.85);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: rgba(226, 232, 240, 0.8);
        --nav-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
        --page-bg: #f1f5f9;
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
        :root {
            --nav-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.8);
            --nav-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            --page-bg: #0f172a;
        }
    }

    /* Global Resets */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
    }

    body {
        min-height: 100vh;
        background-color: var(--page-bg);
        color: var(--text-main);
        position: relative;
        overflow-x: hidden;
        padding: 20px;
    }

    /* Glassmorphism Navigation Bar */
    .nav {
        max-width: 1050px;
        margin: 0 auto 25px auto;
        background: var(--nav-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--nav-shadow);
        position: relative;
        z-index: 10;
        animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .brand {
        font-weight: 700;
        font-size: 17px;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .nav a {
        text-decoration: none;
        color: var(--text-muted);
        font-weight: 600;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .nav a:hover {
        color: #6366f1;
        background: rgba(99, 102, 241, 0.08);
    }

    /* Main Content Wrapper */
    .wrap {
        max-width: 1050px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
    }

    /* Responsive Mobile Design */
    @media (max-width: 700px) {
        .nav {
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            text-align: center;
        }
        .nav-links {
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
        }
        body {
            padding: 12px;
        }
    }
</style>
</head>
<body>
    <div class="nav">
        <div class="brand">🎓 Student Placement Predictor</div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'predict' %}">Predict</a>
                <a href="{% url 'register' %}">Profile</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>
    </div>
    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
