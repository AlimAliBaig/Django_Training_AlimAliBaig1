{% extends 'student/base.html' %}

{% block title %}Student Registration | Student Portal{% endblock %}

{% block content %}
<!-- Background Decorative Animation Elements -->
<div class="registration-bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
</div>

<div class="registration-container">
    <div class="glass-card">
        <div class="card-header">
            <div class="icon-wrapper">
                <span class="cap-icon">🎓</span>
            </div>
            <h1>Student Registration</h1>
            <p class="muted">Save your student profile information before proceeding to prediction.</p>
        </div>

        {% if errormsg %}
            <div class="error-alert animate-shake">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>{{ errormsg }}</span>
            </div>
        {% endif %}

        <form method="post" action="{% url 'savestudent' %}" class="registration-form">
            {% csrf_token %}
            
            <div class="form-grid">
                <div class="field-group">
                    <label for="roll_no">Roll Number</label>
                    <div class="input-wrapper">
                        <input type="text" id="roll_no" name="roll_no" value="{{ form.roll_no|default:'' }}" placeholder="e.g. CS2026001" required autocomplete="off">
                    </div>
                </div>

                <div class="field-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" name="name" value="{{ form.name|default:'' }}" placeholder="e.g. John Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="field-group full-width">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" value="{{ form.email|default:'' }}" placeholder="e.g. student@university.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="field-group">
                    <label for="phone">Phone Number <span class="badge-hint">10 Digits</span></label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" name="phone" maxlength="10" value="{{ form.phone|default:'' }}" placeholder="e.g. 9876543210" required autocomplete="tel">
                    </div>
                </div>

                <div class="field-group">
                    <label for="course">Course / Degree</label>
                    <div class="input-wrapper select-wrapper">
                        <select id="course" name="course" required>
                            <option value="">Select course</option>
                            {% for value, label in courses %}
                                <option value="{{ value }}" {% if form.course == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-shine">
                <span>Save Student Profile</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
    </div>
</div>

<style>
    /* CSS Variables & Theme */
    :root {
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        --card-bg: rgba(255, 255, 255, 0.85);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: rgba(226, 232, 240, 0.8);
        --focus-ring: rgba(99, 102, 241, 0.25);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.8);
        }
    }

    /* Layout & Background Animation */
    body {
        position: relative;
        overflow-x: hidden;
        background: #f1f5f9;
    }

    .registration-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
        padding: 20px;
        position: relative;
        z-index: 2;
    }

    .registration-bg-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
    }

    .shape {
        position: absolute;
        filter: blur(90px);
        opacity: 0.35;
        border-radius: 50%;
        animation: floatShape 12s ease-in-out infinite alternate;
    }

    .shape-1 {
        width: 400px;
        height: 400px;
        background: #818cf8;
        top: 10%;
        left: 15%;
    }

    .shape-2 {
        width: 450px;
        height: 450px;
        background: #f472b6;
        bottom: 10%;
        right: 15%;
        animation-delay: -6s;
    }

    @keyframes floatShape {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-35px) scale(1.08); }
    }

    /* Glassmorphism Card */
    .glass-card {
        width: 100%;
        max-width: 680px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 40px 35px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Header Section */
    .card-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .icon-wrapper {
        width: 60px;
        height: 60px;
        background: var(--primary-gradient);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        animation: pulseIcon 3s ease-in-out infinite;
    }

    @keyframes pulseIcon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .cap-icon {
        font-size: 26px;
    }

    .card-header h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
    }

    .muted {
        font-size: 14px;
        color: var(--text-muted);
    }

    /* Error Alert */
    .error-alert {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #dc2626;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .animate-shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
        40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    /* Form Grid Layout */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 10px;
    }

    .field-group.full-width {
        grid-column: span 2;
    }

    .field-group label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
    }

    .badge-hint {
        font-size: 11px;
        font-weight: 500;
        background: rgba(99, 102, 241, 0.1);
        color: #6366f1;
        padding: 2px 8px;
        border-radius: 6px;
    }

    .input-wrapper input,
    .input-wrapper select {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-size: 14px;
        color: var(--text-main);
        transition: all 0.3s ease;
        outline: none;
    }

    @media (prefers-color-scheme: dark) {
        .input-wrapper input,
        .input-wrapper select {
            background: rgba(15, 23, 42, 0.5);
            color: #f8fafc;
        }
        .input-wrapper select option {
            background: #1e293b;
            color: #f8fafc;
        }
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
        border-color: #6366f1;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 4px var(--focus-ring);
        transform: translateY(-1px);
    }

    .select-wrapper {
        position: relative;
    }

    /* Animated Button */
    .btn-shine {
        position: relative;
        width: 100%;
        padding: 14px;
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        transition: all 0.3s ease;
        margin-top: 24px;
        overflow: hidden;
    }

    .btn-shine svg {
        transition: transform 0.3s ease;
    }

    .btn-shine:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
    }

    .btn-shine:hover svg {
        transform: translateX(4px);
    }

    .btn-shine:active {
        transform: translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
        .field-group.full-width {
            grid-column: span 1;
        }
    }
</style>
{% endblock %}
