<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Prediction Lab</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: white;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(0, 255, 255, .13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 10%,
                    rgba(139, 92, 246, .16),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(0, 140, 255, .12),
                    transparent 35%
                ),
                #020617;
        }


        /* =====================================================
           CYBER GRID
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -5;

            background-image:

                linear-gradient(
                    rgba(0, 255, 255, .035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 255, 255, .035) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            animation:
                gridMove 18s linear infinite;
        }


        @keyframes gridMove {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(55px);
            }

        }


        /* =====================================================
           AURORA
        ===================================================== */

        .aurora {

            position: fixed;

            width: 480px;

            height: 480px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: .25;

            pointer-events: none;

            z-index: -3;
        }


        .aurora.one {

            background: #00ffff;

            left: -180px;

            top: -150px;

            animation:
                auroraOne 11s ease-in-out infinite alternate;
        }


        .aurora.two {

            background: #8b5cf6;

            right: -180px;

            top: 25%;

            animation:
                auroraTwo 14s ease-in-out infinite alternate;
        }


        .aurora.three {

            background: #008cff;

            bottom: -250px;

            left: 35%;

            animation:
                auroraThree 16s ease-in-out infinite alternate;
        }


        @keyframes auroraOne {

            to {
                transform:
                    translate(200px, 180px)
                    scale(1.2);
            }

        }


        @keyframes auroraTwo {

            to {
                transform:
                    translate(-170px, 120px)
                    scale(1.3);
            }

        }


        @keyframes auroraThree {

            to {
                transform:
                    translate(100px, -140px)
                    scale(1.25);
            }

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -2;
        }


        .particle {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 12px #00ffff;

            animation:
                particleFloat linear infinite;
        }


        .particle:nth-child(1) {
            left: 7%;
            top: 80%;
            animation-duration: 9s;
        }

        .particle:nth-child(2) {
            left: 18%;
            top: 60%;
            animation-duration: 13s;
        }

        .particle:nth-child(3) {
            left: 30%;
            top: 90%;
            animation-duration: 11s;
        }

        .particle:nth-child(4) {
            left: 45%;
            top: 70%;
            animation-duration: 8s;
        }

        .particle:nth-child(5) {
            left: 60%;
            top: 85%;
            animation-duration: 14s;
        }

        .particle:nth-child(6) {
            left: 73%;
            top: 65%;
            animation-duration: 10s;
        }

        .particle:nth-child(7) {
            left: 88%;
            top: 80%;
            animation-duration: 12s;
        }

        .particle:nth-child(8) {
            left: 53%;
            top: 50%;
            animation-duration: 15s;
        }


        @keyframes particleFloat {

            0% {

                transform:
                    translateY(0)
                    scale(.4);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(-100vh)
                    scale(1.5);

                opacity: 0;
            }

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .container {

            width: min(1050px, 92%);

            margin: auto;

            padding:
                65px 0 80px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            text-align: center;

            margin-bottom: 45px;

            animation:
                entrance 1.2s
                cubic-bezier(.2,.8,.2,1);
        }


        .badge {

            display: inline-block;

            padding:
                8px 18px;

            border-radius: 50px;

            border:
                1px solid
                rgba(0,255,255,.35);

            color: #00ffff;

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            background:
                rgba(0,255,255,.05);

            box-shadow:
                0 0 25px
                rgba(0,255,255,.12);

            animation:
                badgePulse 2s infinite;
        }


        @keyframes badgePulse {

            50% {

                box-shadow:
                    0 0 40px
                    rgba(0,255,255,.28);
            }

        }


        .header h1 {

            margin-top: 18px;

            font-size:
                clamp(40px, 7vw, 76px);

            font-weight: 900;

            letter-spacing: -3px;

            background:

                linear-gradient(
                    90deg,
                    white,
                    #00ffff,
                    #9b5cff,
                    white
                );

            background-size: 300%;

            -webkit-background-clip: text;

            color: transparent;

            animation:
                gradientMove 5s linear infinite;
        }


        @keyframes gradientMove {

            to {
                background-position: 300%;
            }

        }


        .header p {

            margin-top: 12px;

            color: #94a3b8;

            font-size: 16px;
        }


        /* =====================================================
           MAIN GLASS PANEL
        ===================================================== */

        .panel {

            position: relative;

            padding: 40px;

            border-radius: 32px;

            border:
                1px solid
                rgba(255,255,255,.12);

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.09),
                    rgba(255,255,255,.025)
                );

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);

            box-shadow:

                0 35px 100px
                rgba(0,0,0,.45),

                inset 0 1px
                rgba(255,255,255,.12);

            overflow: hidden;

            animation:
                panelAppear 1.3s
                cubic-bezier(.2,.8,.2,1);
        }


        @keyframes panelAppear {

            from {

                opacity: 0;

                transform:
                    translateY(50px)
                    scale(.96);

                filter:
                    blur(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);
            }

        }


        /* Moving light */

        .panel::before {

            content: "";

            position: absolute;

            width: 220px;

            height: 500px;

            left: -300px;

            top: -100px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.08),
                    transparent
                );

            transform:
                rotate(25deg);

            animation:
                lightSweep 7s
                ease-in-out infinite;
        }


        @keyframes lightSweep {

            0% {
                left: -300px;
            }

            50% {
                left: 120%;
            }

            100% {
                left: 120%;
            }

        }


        /* =====================================================
           PANEL HEADER
        ===================================================== */

        .panel-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 35px;
        }


        .panel-header h2 {

            font-size: 24px;

            font-weight: 700;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #00ffff;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform:
                uppercase;
        }


        .status-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background:
                #00ffff;

            box-shadow:
                0 0 18px
                #00ffff;

            animation:
                statusPulse 1.5s infinite;
        }


        @keyframes statusPulse {

            50% {

                transform:
                    scale(1.8);

                opacity: .4;
            }

        }


        /* =====================================================
           FORM GRID
        ===================================================== */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        /* =====================================================
           INPUT BOX
        ===================================================== */

        .input-box {

            position: relative;

            padding: 20px;

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,.09);

            background:
                rgba(2,6,23,.5);

            transition:
                transform .4s,
                border .4s,
                box-shadow .4s;

            overflow: hidden;
        }


        .input-box:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(0,255,255,.35);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.35),

                0 0 25px
                rgba(0,255,255,.06);
        }


        .input-box label {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 12px;

            color: #94a3b8;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform:
                uppercase;
        }


        .element-symbol {

            color: #00ffff;

            font-size: 15px;

            font-weight: 800;

            text-shadow:
                0 0 10px
                rgba(0,255,255,.6);
        }


        .input-box input {

            width: 100%;

            padding:
                13px 14px;

            border-radius: 12px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.04);

            color: white;

            font-size: 16px;

            transition:
                .3s;
        }


        .input-box input::placeholder {

            color:
                #475569;
        }


        .input-box input:focus {

            border-color:
                #00ffff;

            background:
                rgba(0,255,255,.045);

            box-shadow:
                0 0 0 3px
                rgba(0,255,255,.06),

                0 0 25px
                rgba(0,255,255,.12);

            transform:
                translateY(-2px);
        }


        /* =====================================================
           INPUT SCAN
        ===================================================== */

        .input-line {

            position: absolute;

            left: 0;

            bottom: 0;

            height: 2px;

            width: 0;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #9b5cff
                );

            transition:
                width .5s;
        }


        .input-box:focus-within
        .input-line {

            width: 100%;

        }


        /* =====================================================
           SUBMIT AREA
        ===================================================== */

        .submit-area {

            margin-top: 35px;

            text-align: center;
        }


        .submit-button {

            position: relative;

            border: none;

            outline: none;

            cursor: pointer;

            padding:
                17px 55px;

            border-radius: 50px;

            color: #020617;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform:
                uppercase;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #7c3aed,
                    #00ffff
                );

            background-size:
                200%;

            box-shadow:

                0 0 25px
                rgba(0,255,255,.25),

                0 15px 35px
                rgba(0,0,0,.3);

            transition:
                transform .3s,
                box-shadow .3s;

            animation:
                buttonGradient 4s
                linear infinite;
        }


        @keyframes buttonGradient {

            to {
                background-position:
                    200%;
            }

        }


        .submit-button:hover {

            transform:
                translateY(-5px)
                scale(1.03);

            box-shadow:

                0 0 45px
                rgba(0,255,255,.45),

                0 20px 45px
                rgba(0,0,0,.4);
        }


        .submit-button:active {

            transform:
                scale(.96);
        }


        /* =====================================================
           BUTTON RIPPLE
        ===================================================== */

        .submit-button::before {

            content: "";

            position: absolute;

            inset: -5px;

            border-radius: 50px;

            border:
                1px solid
                rgba(0,255,255,.3);

            animation:
                buttonRipple 2s
                infinite;
        }


        @keyframes buttonRipple {

            0% {

                transform:
                    scale(1);

                opacity: 1;
            }

            100% {

                transform:
                    scale(1.18);

                opacity: 0;
            }

        }


        /* =====================================================
           SCAN LINE
        ===================================================== */

        .scan-line {

            height: 2px;

            width: 100%;

            margin-top: 35px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #00ffff,
                    #9b5cff,
                    transparent
                );

            background-size:
                200%;

            animation:
                scan 3s linear infinite;
        }


        @keyframes scan {

            from {
                background-position:
                    200%;
            }

            to {
                background-position:
                    -200%;
            }

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 35px;

            text-align: center;

            color: #475569;

            font-size: 11px;

            letter-spacing: 3px;
        }


        /* =====================================================
           MOUSE GLOW
        ===================================================== */

        .mouse-glow {

            position: fixed;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            pointer-events: none;

            z-index: -1;

            background:
                radial-gradient(
                    circle,
                    rgba(0,255,255,.08),
                    transparent 65%
                );

            transform:
                translate(-50%, -50%);
        }


        /* =====================================================
           ENTRANCE
        ===================================================== */

        @keyframes entrance {

            from {

                opacity: 0;

                transform:
                    translateY(35px);

                filter:
                    blur(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

                filter:
                    blur(0);
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .container {

                padding-top:
                    40px;
            }


            .panel {

                padding:
                    25px;
            }


            .form-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .form-grid {

                grid-template-columns:
                    1fr;
            }


            .panel-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap: 15px;
            }


            .header h1 {

                letter-spacing:
                    -2px;
            }


            .submit-button {

                width: 100%;
            }

        }

    </style>

</head>


<body>

    <script>


        /* =====================================================
           MOUSE FOLLOWING LIGHT
        ====================================================== */

        const mouseGlow =
            document.getElementById("mouseGlow");


        document.addEventListener(
            "mousemove",
            event => {

                mouseGlow.style.left =
                    event.clientX + "px";

                mouseGlow.style.top =
                    event.clientY + "px";

            }
        );


        /* =====================================================
           3D PANEL TILT
        ====================================================== */

        const panel =
            document.querySelector(".panel");


        panel.addEventListener(
            "mousemove",
            event => {

                const rect =
                    panel.getBoundingClientRect();


                const x =
                    event.clientX - rect.left;


                const y =
                    event.clientY - rect.top;


                const centerX =
                    rect.width / 2;


                const centerY =
                    rect.height / 2;


                const rotateX =
                    ((y - centerY) /
                    centerY) * -1.5;


                const rotateY =
                    ((x - centerX) /
                    centerX) * 1.5;


                panel.style.transform = `

                    perspective(1200px)

                    rotateX(${rotateX}deg)

                    rotateY(${rotateY}deg)

                    translateY(-4px)

                `;

            }
        );


        panel.addEventListener(
            "mouseleave",
            () => {

                panel.style.transform =
                    "perspective(1200px) rotateX(0) rotateY(0) translateY(0)";

            }
        );


        /* =====================================================
           SUBMIT ANIMATION
        ====================================================== */

        const form =
            document.querySelector("form");


        const button =
            document.querySelector(".submit-button");


        form.addEventListener(
            "submit",
            () => {

                button.innerHTML =
                    "⟳ Processing...";

                button.style.pointerEvents =
                    "none";

            }
        );


    </script>
