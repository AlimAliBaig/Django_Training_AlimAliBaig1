<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'mycss2.css' %}">

</head>
<body>
    <div>
        <h1>Result of {{name}}</h1>
    </div>
    <div>
        {% if marks >= 80 %}
        <h2>You're Grade is A</h2>
        {% elif marks >= 70 %}
        <h2>You're Grade is B</h2>
        {% elif marks >= 60 %}
        <h2>You're Grade is C</h2>
        {% elif marks >= 50 %}
        <h2>You're Grade is D</h2>
        {% else %}
        <h2>Yor're Fail</h2>
        {% endif %}
    </div>
</body>
</html>
